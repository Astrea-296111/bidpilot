[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bidpilot"
version = "0.1.0"
description = "Evidence-grounded RFP analysis with LangGraph, hybrid RAG and MCP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "langchain>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2", "langchain-text-splitters>=1,<2",
  "pydantic>=2.9,<3", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3",
  "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1", "redis>=5,<9",
  "qdrant-client>=1.14,<2", "rank-bm25==0.2.2", "mcp>=1.20,<2",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "httpx[socks]>=0.28,<1",
  "numpy>=1.26,<3", "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]
ui = ["streamlit>=1.45,<2"]
models = ["sentence-transformers>=3,<6"]

[project.scripts]
bidpilot = "bidpilot.cli:main"
bidpilot-mcp = "bidpilot_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src", "mcp_server"]

[tool.setuptools.package-data]
bidpilot = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Accessing the 'model_fields':DeprecationWarning"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
